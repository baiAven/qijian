name: 功能问题
description: 报告搜索、保存、同步或显示问题
title: "[Bug] "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备、操作系统与浏览器版本
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 不要粘贴连接码、备份文件中的敏感资料或账号凭据。
